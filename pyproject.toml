[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-hypothesis-engine"
version = "0.1.0"
description = "A domain-agnostic, human-in-the-loop system for constructing, versioning, and experimenting with causal hypothesis networks."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "rich>=13.0,<16",
    "anthropic>=0.40.0,<1",
    "pandas>=2.0,<4",
    "pyarrow>=14.0",
    # Required for backtest scoring. Not optional: without it the adapter
    # cannot compute AUC, and silently reporting a different metric under the
    # AUC label is worse than failing loudly.
    "scikit-learn>=1.3,<2",
    # Imported directly by analysis.py for the partial-correlation p-value.
    # Guaranteed transitively by scikit-learn, but declared because we use it.
    "scipy>=1.10,<2",
    # Required for graph invariants (acyclicity) and d-separation.
    "networkx>=3.0,<4",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.0",
]
financial = [
    "fredapi>=0.5",
    "yfinance>=0.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
causal-engine = "causal_hypothesis_engine.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["causal_hypothesis_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]
