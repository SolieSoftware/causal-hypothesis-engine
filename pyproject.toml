[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-hypothesis-engine"
version = "0.1.0"
description = "A domain-agnostic, human-in-the-loop system for constructing, versioning, and experimenting with causal hypothesis networks."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "anthropic>=0.40.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
causal-engine = "causal_hypothesis_engine.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["causal_hypothesis_engine"]
